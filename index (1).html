<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="si-disclosure" content="ChatGPT assisted submission text, demonstration text and interface code on 2026-11-15. Team: StratumShield. Member: Ts.Otgonjargal. Claude and ChatGPT use confirmed by the team; specific Claude contributions not itemized. Synthetic demonstration data.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTROVITAL Crew Health Monitor</title>
<meta name="description" content="ASTROVITAL: astronaut health monitoring and decision-support prototype. All data is synthetic demonstration data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ASTROVITAL: one dark flight-deck theme by choice. Layout idea: fixed instrument rail on the left,
   mission strip on top, dense cards on a 12-column grid that stacks on tablets. */
:root {
  color-scheme: dark;
  --bg: #060a13; --panel: #0c1422; --panel-2: #111b2e; --line: #1d2b45; --line-2: #2a3d60;
  --text: #dce7f7; --muted: #8597b4; --faint: #5b6d8c;
  --accent: #3fd0ea; --accent-2: #4f8dff;
  --green: #3ddc97; --yellow: #f6c453; --red: #ff5f6d;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 22px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0; } a { color: var(--accent); } ul, ol { margin: 0; padding-left: 18px; } li + li { margin-top: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; } .right { text-align: right; }

.app { display: grid; grid-template-columns: 216px 1fr; height: 100%; }
.rail { background: linear-gradient(180deg, #0a1120, #070c17); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); display: grid; place-items: center; color: var(--accent); box-shadow: 0 0 18px rgba(63,208,234,.25) inset; }
.brand b { font-family: var(--display); font-size: 17px; letter-spacing: .12em; display: block; line-height: 1.1; }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; border: 1px solid transparent; cursor: pointer; background: none; width: 100%; text-align: left; }
.nav:hover { color: var(--text); background: rgba(79,141,255,.08); }
.nav.on { color: var(--text); background: rgba(63,208,234,.1); border-color: rgba(63,208,234,.35); }
.nav svg { flex: none; width: 17px; height: 17px; }
.nav .count { margin-left: auto; font: 600 11px var(--mono); padding: 1px 6px; border-radius: 9px; background: var(--yellow); color: #1b1400; }
.nav .count.red { background: var(--red); color: #24000a; }
.rail-foot { margin-top: auto; padding: 10px 8px 2px; font-size: 11px; color: var(--faint); line-height: 1.4; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: rgba(10,17,32,.9); }
.strip .grow { flex: 1; min-width: 160px; }
.strip .mission { font-family: var(--display); font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: rgba(63,208,234,.14); color: var(--text); }
.demo-tag { font: 600 10.5px var(--mono); letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; border: 1px dashed var(--yellow); color: var(--yellow); white-space: nowrap; }
.tag { font: 600 10px var(--mono); letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; text-transform: uppercase; }
.tag.sim { border-color: rgba(246,196,83,.5); color: var(--yellow); } .tag.user { border-color: rgba(63,208,234,.5); color: var(--accent); }
.link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: none; cursor: pointer; }
.link.up { border-color: rgba(61,220,151,.5); color: var(--green); } .link.down { border-color: rgba(246,196,83,.5); color: var(--yellow); }
.content { flex: 1; overflow-y: auto; padding: 20px; }
.page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 16px; justify-content: space-between; }
.head p { color: var(--muted); max-width: 70ch; }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2, .card h3 { display: flex; align-items: center; gap: 8px; }
.card h2 svg, .card h3 svg { color: var(--accent); flex: none; }
.card .sub { color: var(--muted); font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .col { display: flex; flex-direction: column; gap: 8px; } .between { justify-content: space-between; }
.sep { height: 1px; background: var(--line); border: 0; margin: 2px 0; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); letter-spacing: .06em; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.green { color: var(--green); background: rgba(61,220,151,.1); } .pill.yellow { color: var(--yellow); background: rgba(246,196,83,.12); }
.pill.red { color: var(--red); background: rgba(255,95,109,.14); } .pill.none { color: var(--faint); background: rgba(133,151,180,.1); }
.banner { border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; border-left-width: 5px; }
.banner.green { border-left-color: var(--green); } .banner.yellow { border-left-color: var(--yellow); } .banner.red { border-left-color: var(--red); }
.banner h1 { font-size: 20px; } .banner .grow { flex: 1; min-width: 240px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; border-top: 3px solid var(--line-2); min-width: 0; }
.tile:hover { border-color: var(--line-2); } .tile.green { border-top-color: var(--green); } .tile.yellow { border-top-color: var(--yellow); } .tile.red { border-top-color: var(--red); }
.tile .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tile .val { font: 600 25px/1.15 var(--mono); font-variant-numeric: tabular-nums; } .tile .val small { font: 400 12px var(--body); color: var(--muted); margin-left: 4px; }
.tile .pill { align-self: flex-start; }
.tile .meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font-size: 13px; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--accent); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #2bb8d4, #1f8fb0); border-color: #46d6ef; color: #021017; font-weight: 600; }
.btn.warn { border-color: rgba(255,95,109,.6); color: var(--red); } .btn.sm { padding: 4px 9px; font-size: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], input[type=datetime-local], select, textarea { background: #08101d; border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; color: var(--text); min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 60px; font-family: var(--mono); font-size: 12px; }
.err { color: var(--red); font-size: 12.5px; } .ok { color: var(--green); font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line-2); padding: 2px 0 2px 10px; }
.note.warn { border-left-color: var(--yellow); }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font: 600 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td input[type=number] { width: 84px; padding: 4px 6px; }

.alert { border: 1px solid var(--line); border-left: 4px solid var(--yellow); border-radius: 10px; background: var(--panel-2); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.alert.red { border-left-color: var(--red); } .alert.resolved { border-left-color: var(--faint); opacity: .85; }
.alert h3 { font-size: 14.5px; } .kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; } .kv dd { margin: 0; }
.list { display: flex; flex-direction: column; gap: 8px; } .item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.item svg { flex: none; margin-top: 2px; color: var(--accent); } .item .grow { flex: 1; min-width: 0; }
.done { color: var(--green); } .todo { color: var(--faint); }
.bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { padding: 8px 4px; border-radius: 8px; border: 1px solid var(--line-2); background: #08101d; cursor: pointer; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.scale button b { font: 600 15px var(--mono); color: var(--text); } .scale button.on { border-color: var(--accent); background: rgba(63,208,234,.14); color: var(--text); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; } .steps span { font: 600 11px var(--mono); padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line-2); color: var(--muted); }
.steps span.on { border-color: var(--accent); color: var(--accent); } .steps span.past { color: var(--green); border-color: rgba(61,220,151,.4); }
.chart { width: 100%; height: auto; display: block; } .chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.modal-bg { position: fixed; inset: 0; background: rgba(2,5,10,.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 18px; width: min(760px, 100%); max-height: 88%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; background: var(--panel-2); border: 1px solid var(--line-2); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; max-width: 380px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.yellow { border-left-color: var(--yellow); } .toast.red { border-left-color: var(--red); }
.pulse { animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .45; } }
.body3d { width: 100%; display: block; border-radius: 10px; background: radial-gradient(ellipse at 50% 40%, #0d1a30 0%, #070c17 70%); border: 1px solid var(--line); cursor: grab; touch-action: none; }
.body3d:active { cursor: grabbing; }
.fade { animation: fade .22s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.tile { transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
button.tile:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
.btn, .nav { transition: border-color .15s ease, background-color .15s ease, color .15s ease; }
.wrap3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); }
details > summary { cursor: pointer; font-family: var(--display); font-weight: 600; }
details[open] > summary { margin-bottom: 10px; } details > * + * { margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .pulse, .fade { animation: none; } .tile, .btn, .nav { transition: none; } button.tile:hover { transform: none; } }

@media (max-width: 1100px) { .c3 { grid-column: span 6; } .c4, .c5, .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; align-items: center; padding: 8px 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 8px 0 2px; } .brand span, .rail-foot { display: none; }
  .nav { width: auto; white-space: nowrap; padding: 7px 10px; } .nav .count { margin-left: 4px; }
  .content { padding: 14px; } .kv { grid-template-columns: 1fr; gap: 1px 0; } .kv dd { margin-bottom: 6px; }
}

.submission-field {display:flex;flex-direction:column;gap:16px;padding:22px;overflow-wrap:anywhere}
.submission-field p {max-width:100ch;line-height:1.7}
.submission-empty {display:flex;gap:20px;flex-wrap:wrap}.submission-empty label {display:grid;gap:6px}.submission-empty input{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:6px}
.demo-slide {min-height:550px;padding:clamp(24px,5vw,64px);border:1px solid var(--line-2);border-radius:16px;background:radial-gradient(ellipse at top right,#133751,transparent 65%),var(--panel);display:flex;flex-direction:column;align-items:flex-start;gap:26px}
.demo-eyebrow {font:14px var(--mono);color:var(--accent);letter-spacing:.12em}.demo-slide h1{font-size:clamp(28px,4vw,52px);max-width:22ch}.demo-body{font-size:clamp(18px,2vw,24px);max-width:65ch;line-height:1.65}.demo-note{border-left:3px solid var(--accent);padding-left:18px;color:#a9bdd8;max-width:80ch}.demo-disclosure{font-size:11px;color:var(--muted);margin-top:auto}.demo-controls{display:flex;align-items:center;justify-content:space-between;gap:15px}.demo-controls button:disabled{opacity:.35;cursor:default}

</style>
</head>

ne",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},child:[{tag:"path",attr:{d:"M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"},child:[]},{tag:"path",attr:{d:"M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"},child:[]},{tag:"path",attr:{d:"M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"},child:[]},{tag:"path",attr:{d:"M17.599 6.5a3 3 0 0 0 .399-1.375"},child:[]},{tag:"path",attr:{d:"M6.003 5.125A3 3 0 0 0 6.401 6.5"},child:[]},{tag:"path",attr:{d:"M3.477 10.896a4 4 0 0 1 .585-.396"},child:[]},{tag:"path",attr:{d:"M19.938 10.5a4 4 0 0 1 .585.396"},child:[]},{tag:"path",attr:{d:"M6 18a4 4 0 0 1-1.967-.516"},child:[]},{tag:"path",attr:{d:"M19.967 17.484A4 4 0 0 1 18 18"},child:[]}]})(t)}function Lr(t){return tt({tag:"svg",attr:{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},child:[{tag:"path",attr:{d:"M12 7v14"},child:[]},{tag:"path",attr:{d:"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"},child:[]}]})(t)}function Mi(t){return tt({tag:"svg",attr:{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},child:[{tag:"path",attr:{d:"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"},child:[]},{tag:"path",attr:{d:"M10.3 21a1.94 1.94 0 0 0 3.4 0"},child:[]}]})(t)}function yi(t){return tt({tag:"svg",attr:{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},child:[{tag:"path",attr:{d:"M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"},child:[]}]})(t)}var wi="MedlinePlus resting-adult range (Earth). Configurable illustrative default; not a NASA standard; not validated for spaceflight.",Gc="No reference range is established for this prototype. Only your personal baseline is used.",_n="Illustrative 1-5 self-report scale. Not a validated psychometric instrument.",E={hr:{id:"hr",label:"Heart rate",short:"HR",unit:"bpm",kind:"vital",decimals:0,entry:[20,250],worse:0,refNote:wi,sources:["MLP-VITALS","CSA-BIOMON"],guide:{what:"How many times your heart beats in one minute while you are at rest.",why:"Resting heart rate reflects how hard the cardiovascular system is working. NASA lists altered gravity among its five spaceflight hazards, and the cardiovascular system is one of the systems that adapts to it. A change from your own usual value is more informative than a single number.",equipment:"Wearable heart-rate sensor or pulse oximeter. Without a device: a timer and two fingers on the wrist pulse.",steps:["Stop activity and stay still for 5 minutes.","Fit the sensor snugly, or place two fingers on the inside of the wrist below the thumb.","Read the device after the value has settled, or count beats for 60 seconds.","Enter the value in beats per minute."],mistakes:["Measuring straight after exercise.","A loose sensor or cold fingers.","Counting for 15 seconds and multiplying, which amplifies counting errors.","Using the thumb to feel the pulse."],meaning:"ASTROVITAL compares the reading with the configured reference range and with your own baseline. A single unusual reading is a prompt to repeat the measurement, not a conclusion."}},spo2:{id:"spo2",label:"Blood oxygen saturation",short:"SpO2",unit:"%",kind:"vital",decimals:0,entry:[50,100],worse:-1,refNote:wi+" MedlinePlus also advises contacting a provider at 92% or lower and seeking immediate attention at 88% or lower.",sources:["MLP-SPO2","CSA-BIOMON"],guide:{what:"The percentage of haemoglobin in your blood that is carrying oxygen, estimated through the skin.",why:"It indicates how well oxygen is reaching the blood. A spacecraft is a closed environment, which NASA lists as a hazard, so cabin atmosphere and personal readings are both worth watching. A pulse oximeter is an estimate: MedlinePlus notes results may be 2 to 4 points above or below the true value.",equipment:"Fingertip pulse oximeter or a wearable with an SpO2 sensor.",steps:["Rest for 5 minutes with your hand warm and relaxed.","Clip the oximeter on a fingertip and keep the hand still.","Wait until the number is steady for several seconds.","Enter the steady value as a percentage."],mistakes:["Cold hands or a moving hand.","Reading the pulse-rate number instead of the SpO2 number.","Recording the first value before it settles.","A poorly seated sensor."],meaning:"A reading below the configured range should be repeated after checking the sensor. A confirmed low reading is a reason to contact the medical team."}},sbp:{id:"sbp",label:"Blood pressure (systolic)",short:"SYS",unit:"mmHg",kind:"vital",decimals:0,entry:[50,260],worse:0,refNote:wi,sources:["MLP-VITALS","CSA-BIOMON"],guide:{what:"The pressure of blood against artery walls, given as two numbers: systolic when the heart beats, diastolic between beats.",why:"Blood pressure is a basic cardiovascular indicator. Fluid and cardiovascular adaptation to altered gravity is part of why NASA tracks this hazard. Compare readings with your own history.",equipment:"Automatic upper-arm blood pressure cuff.",steps:["Rest for 5 minutes. Do not talk during the reading.","Place the cuff on a bare upper arm at heart level.","Start the device and stay still until it finishes.","Enter both numbers: systolic first, then diastolic."],mistakes:["Cuff over clothing or the wrong cuff size.","Talking or moving during inflation.","Measuring right after exercise or caffeine.","Arm not supported at heart level."],meaning:"Both numbers are checked against the configured range and your baseline. Repeat an unexpected reading after a few minutes of rest."}},dbp:{id:"dbp",label:"Blood pressure (diastolic)",short:"DIA",unit:"mmHg",kind:"vital",decimals:0,entry:[30,160],worse:0,refNote:wi,sources:["MLP-VITALS"]},temp:{id:"temp",label:"Body temperature",short:"TEMP",unit:"\xB0C",kind:"vital",decimals:1,entry:[32,43],worse:0,refNote:wi,sources:["MLP-VITALS","CSA-BIOMON"],guide:{what:"Your body temperature in degrees Celsius.",why:"Temperature is a general sign of how the body is coping. NASA notes that it tracks immune responses in the closed spacecraft environment, so a change from your own usual value is worth recording.",equipment:"Clinical thermometer. Use the same type and site each time.",steps:["Wait 15 minutes after eating, drinking, or exercise.","Place the thermometer as its instructions describe.","Wait for the device signal.","Enter the value in degrees Celsius."],mistakes:["Switching between measurement sites, which read differently.","Measuring right after a hot or cold drink.","Removing the thermometer before it signals.","Entering Fahrenheit instead of Celsius."],meaning:"A reading outside the configured range should be repeated. Skin-temperature wearables read lower than core thermometers and are not interchangeable."}},rr:{id:"rr",label:"Respiratory rate",short:"RR",unit:"breaths/min",kind:"vital",decimals:0,entry:[4,60],worse:0,refNote:wi,sources:["MLP-VITALS","CSA-BIOMON"],guide:{what:"How many breaths you take in one minute at rest.",why:"Breathing rate changes with exertion, stress, and how well the lungs and circulation are working. It is one of the signals the CSA Bio-Monitor records in flight.",equipment:"A timer, or a wearable that reports breathing rate.",steps:["Rest for 5 minutes.","Breathe normally. One rise and fall of the chest is one breath.","Count breaths for a full 60 seconds.","Enter the count."],mistakes:["Changing your breathing because you are counting it.","Counting for less than a full minute.","Measuring soon after exercise."],meaning:"The count is compared with the configured range and your baseline. Repeat an unexpected value after resting."}},sleepH:{id:"sleepH",label:"Sleep duration",short:"SLEEP",unit:"h",kind:"daily",decimals:1,entry:[0,16],worse:-1,refNote:Gc+" Context: in a study of shuttle and ISS crews, mean in-flight sleep was about 6 hours against 8.5 hours scheduled (Barger et al. 2014). That is a group finding, not a personal threshold.",sources:["BARGER-2014","HRP-HAZARDS"],guide:{what:"How many hours you actually slept in your last sleep period.",why:"Sleep loss is documented in spaceflight crews, and NASA lists isolation and confinement, with altered light and schedules, among its hazards. A falling trend matters more than one short night.",equipment:"Sleep log or a wearable with actigraphy.",steps:["Note when you fell asleep and when you woke.","Subtract time spent awake during the sleep period.","Enter hours slept, to one decimal place.","Rate sleep quality in the wellness check-in."],mistakes:["Entering time in bed instead of time asleep.","Skipping the log on bad nights, which hides the trend.","Counting naps into the main sleep period."],meaning:"ASTROVITAL looks at your last three logs against your own baseline, and at sleep together with fatigue and stress."}},sleepQ:{id:"sleepQ",label:"Sleep quality",short:"SLEEP Q",unit:"1-5",kind:"scale",decimals:0,entry:[1,5],worse:-1,refNote:_n,sources:["BARGER-2014"]},hydration:{id:"hydration",label:"Fluid intake",short:"FLUID",unit:"L/day",kind:"daily",decimals:1,entry:[0,8],worse:-1,refNote:Gc,sources:[],guide:{what:"How much fluid you drank in the last 24 hours, in litres.",why:"Fluid intake is a simple self-reported indicator of hydration habits. A spaceflight-specific method and target are NOT ESTABLISHED in this prototype, so only your own baseline is used.",equipment:"Drink bag volume markings or the galley log.",steps:["Add up the drink containers you finished in the last 24 hours.","Convert to litres.","Enter the total to one decimal place."],mistakes:["Guessing instead of counting containers.","Leaving out drinks taken with meals.","Entering millilitres instead of litres."],meaning:"A sustained drop against your own baseline is flagged f erified here. Longer exposure to the space environment increases the importance of monitoring physical and mental health.",solution_goal:"Create a visual tool that helps astronauts assess their health during space missions and provides guidance on treatments and health improvements.",possible_input_modalities:["Keyboard-entered text","Mouse clicks or other user selections","Camera images","Other data inputs, provided they represent a health indicator"],example_health_data:[{indicator:"Blood glucose",example_unit:"mg/dL",example_type:"Numeric measurement"},{indicator:"Ultrasound",example_unit:null,example_type:"Medical image"}],example_health_indicators:[{name:"Blood pressure",unit_or_format:null},{name:"Heart rate",unit_or_format:null},{name:"Blood sugar",unit_or_format:null},{name:"Body temperature",unit_or_format:null},{name:"Daily sleep duration",unit_or_format:"Hours per day (implied by the source wording)"},{name:"Mood",unit_or_format:"Self-report or other representation not specified"}],design_questions_raised_by_the_brief:["Which measurements can be performed in space?","Why is an examination needed?","How do spaceflight hazards affect health indicators?","When might a result warrant attention from the crew or flight surgeons on the ground?","What actions can help prevent a critical health condition?"],interface_guidance:["Present metrics and diagnostic information clearly.","Consider animations and interactive elements.","One example is a clickable human-body figure whose body regions display information about function and health status.","Provide simple instructions and explanations; do not assume astronauts already know how to assess every indicator or risk."],optional_capabilities:["Provide health insights for different mission environments, including spacecraft, space stations, rovers, and bases on another planet or moon.","Prompt astronauts periodically to take measurements or complete health-supporting actions as part of mission routines.","Use gamification to encourage engagement with health-supporting tasks.","Show changes in health indicators over time using dynamic charts.","Use color coding to communicate indicator status at a glance."],resource_notice:"The challenge brief says additional resources may be added before the hackathon begins.",embedded_video:{title:"2026 Challenge | Create Health Monitoring Software for Astronauts on Space Missions",url:"https://www.youtube.com/embed/RERG3gEmdC8?feature=oembed"}},spaceflight_hazards:[{id:"H1",name:"Space Radiation",description:"Exposure to ionizing radiation beyond the protection provided by Earth's atmosphere and magnetic field. The source describes radiation as a major hazard, particularly for deep-space missions.",health_relevance_in_source:["Potential increased cancer risk","Potential effects on the central nervous system, including altered cognitive function, reduced motor function, and behavioral changes","Other effects listed in the supplied video transcript include nausea, vomiting, anorexia, fatigue, cataracts, cardiac disease, and circulatory disease"],reference_url:"https://www.nasa.gov/hrp/hazard-space-radiation/"},{id:"H2",name:"Isolation and Confinement",description:"Psychological and social challenges associated with living for extended periods in a small, enclosed space with a limited crew, far from Earth.",health_relevance_in_source:["Declines in mood or morale","Changes in interpersonal interaction","Possible sleep disorders","Behavioral or cognitive conditions and potential team miscommunication"],reference_url:"https://www.nasa.gov/hrp/hazard-isolation-and-confinement/"},{id:"H3",name:"Distance from Earth",description:"As astronauts travel farther from Earth, receiving instructions, supplies, and medical care becomes more difficult. Emergency return and immediate resupply may not be possible on deep-space missions.",health_relevance_in_source:["Delayed access to instructions and support","Greater logistical and medical constraints","Reduced ability to return rapidly to Earth or receive immediate resupply"],reference_url:"https://www.nasa.gov/hrp/hazard-distance-from-earth/"},{id:"H4",name:"Gravity Fields (or Lack Thereof)",description:"Astronauts' muscles, bones, inner ear, and organs must adapt to different gravity environments, including spacecraft microgravity, the lower gravity of the Moon or Mars, and Earth's gravity after return.",health_relevance_in_source:["Bone and muscle loss","Changes in blood circulation and cardiovascular function","Motion sickness, dizziness, and coordination difficulties during gravitational transitions"],reference_url:"https://www.nasa.gov/hrp/hazard-gravity-fields/"},{id:"H5",name:"Hostile or Closed Environments",description:"A spacecraft is a man-made environment that must maintain safe conditions. The source identifies temperature, pressure, lighting, noise, microbial communities, and immune responses as relevant considerations; a later summary also mentions air quality.",health_relevance_in_source:["Environmental conditions must be managed to sustain life.","Microbial communities and immune responses require monitoring.","Noise, lighting, temperature, pressure, and air quality are identified as environmental factors."],reference_url:null}],video_transcripts:[{topic:"Space Radiation",hazard_id:"H1",source_context:"The supplied text identifies this as a transcription of on-screen text from a NASA video about the first human-spaceflight hazard.",segments:[{section:"Introduction",text:"Five hazards of human spaceflight. Hazard one: Space radiation."},{section:"The problem",text:"One of the most dangerous aspects of traveling to Mars is space radiation. The types of radiation astronauts would encounter on a Mars mission are much different from those on Earth and are described in the transcript as more damaging."},{section:"Earth's protection",text:"The transcript states that the International Space Station is just within Earth's protective magnetic field and that astronauts there are exposed to 10 times more radiation than on Earth, although this is much less than exposure in deep space."},{section:"Human risk",text:"Above Earth's protective shielding, radiation exposure may increase cancer risk and can damage the central nervous system, potentially manifesting as altered cognitive function, reduced motor function, and behavioral changes."},{section:"Dangers listed",items:["Nausea","Vomiting","Anorexia","Fatigue","Cataracts","Cardiac disease","Circulatory disease"]},{section:"Research and countermeasures",text:"NASA's Human Research Program is studying how radiation affects the body and mind and how to protect them. The transcript mentions biomarker research, studying the body's response to radiation, and identifying biological countermeasures using ground research facilities and data."},{section:"Conclusion",text:"One hazard explored. One step closer to Mars."}]},{topic:"Isolation and Confinement",hazard_id:"H2",source_context:"The supplied text identifies this as a transcription of on-screen text from a NASA video about the second human-spaceflight hazard.",segments:[{section:"Introduction",text:"Five hazards of human spaceflight. Hazard two: Isolation and confinement."},{section:"The problem",text:"The transcript says behavioral issues among groups living in a small space for a long time can occur regardless of how well trained they are."},{section:"Selection and support",text:"Astronauts selected for space-station missions are carefully chosen, trained, and supported. Crews for a Mars mission are expected to undergo further scrutiny and preparation for greater isolation and confinement."},{section:"Human risks",items:["Decline in mood or morale","Changes in interpersonal interaction","Possible development of a sleep disorder"]},{section:"Environmental factors",items:["Small, noisy environment","The transcript mentions an extra 38 minutes of daylight on Mars","Stress from prolonged isolation and confinement"]},{section:"Mission demands",text:"The trip to Mars is described as alternating between heavy workloads and periods of boredom. Limited access to fresh food and variety may contribute to monotony and nutritional deficiency, which may affect psychological or physical balance. The transcript also links prolonged confinement and isolation with greater likelihood of behavioral or cognitive conditions and possible team miscommunication."},{section:"Countermeasures",items:["Lighting","Movement","Sleep","Crew members / social support"]},{section:"Monitoring tools",text:"The source transcript contains unclear wording about devices and crew journals. It appears to refer to journals as a way for crew members to express frustrations and support mental and physical well-being; the exact wording is preserved in the data-quality notes rather than being treated as a verified statement."},{section:"Closing",text:"All of these methods and technologies will help prepare for longer, farther exploration missions. One hazard explored, one step closer to Mars."}]}],human_health_risks:[{id:"R1",name:"Altered Immune System Responses",description:"Spaceflight stressors may reactivate inactive viruses, leading to rashes and other symptoms. Research seeks to better understand immune-system changes.",reference_url:"https://www.nasa.gov/reference/risk-of-altered-immune-system-responses/"},{id:"R2",name:"Altered Sensorimotor and Vestibular Function",description:"Gravitational changes may be associated with motion sickness, hand-eye or gait-coordination issues, and dizziness, which can make walking or operating a vehicle difficult.",reference_url:"https://www.nasa.gov/reference/risk-of-altered-sensorimotor-and-vestibular-function/"},{id:"R3",name:"Cardiovascular Adaptations",description:"Weightlessness can alter blood circulation and the function of the heart and blood vessels, potentially increasing cardiovascular risk.",reference_url:"https://www.nasa.gov/reference/risk-of-cardiovascular-adaptations/"},{id:"R4",name:"Decompression Sickness",description:"Transitioning from a pressurized spacecraft to a lower-pressure spacesuit can cause dissolved nitrogen to form bubbles in body tissues. Research focuses on prevention and faster treatment options.",reference_url:"https://www.nasa.gov/reference/risk-of-decompression-sickness/"},{id:"R5",name:"Host\u2013Microorganism Interactions",description:"Skin and gut microbiomes can change in space, potentially increasing the risk of illness among crew members.",reference_url:"https://www.nasa.gov/reference/risk-of-host-microorganism-interactions/"},{id:"R6",name:"Hypoxia",description:"The source says procedures intended to prevent decompression sickness during future spacewalks may also elevate the risk of mild hypoxia, a condition in which oxygen levels in body tissues are lower than normal.",reference_url:"https://www.nasa.gov/reference/risk-of-hypoxia/"},{id:"R7",name:"Inadequate Food and Nutrition",description:"A healthy, balanced diet is important for crew health and performance. Research addresses the design of enjoyable, nutritious, long-lasting meals for deep-space missions and the consequences of inadequate nutrition.",reference_url:"https://www.nasa.gov/reference/risk-of-inadequate-food-and-nutrition/"},{id:"R8",name:"Injury and Compromised Performance During Extravehicular Activity (EVA)",description:"Spacesuit work can involve cognitive fatigue and injury. EVA-related concerns include decompression sickness, low oxygen, and high carbon dioxide; research examines human performance in spacesuits and the balance of pressure and oxygen levels.",reference_url:"https://www.nasa.gov/reference/risk-of-injury-and-compromised-performance-from-extravehicular-activity-eva/"},{id:"R9",name:"Reduced Cardiorespiratory and Musculoskeletal Fitness",description:"Exercise during missions is used to counteract losses in bone density, muscle strength, and heart and blood-vessel performance. Research examines exercise approaches that protect health and spacewalk capability.",reference_url:"https://www.nasa.gov/reference/risk-of-reduced-cardiorespiratory-and-musculoskeletal-fitness/"},{id:"R10",name:"Spaceflight-Associated Neuro-Ocular Syndrome (SANS)",description:"The structure of the eyes and brain can change during spaceflight. Research focuses on understanding long-term consequences and prevention.",reference_url:"https://www.nasa.gov/reference/risk-of-spaceflight-associated-neuro-ocular-syndrome-sans/",source_caption_note:"The source's image caption calls the condition 'Visual Impairment Intracranial Pressure (VIIP) Syndrome', says it was identified in 2005, describes it as NASA's leading spaceflight-related health risk, and claims it is more predominant among men than women in space. The linked risk page is identified as SANS. These are unverified source-caption claims; the caption wording is not silently substituted for the linked risk title."},{id:"R11",name:"Spaceflight-Induced Bone Changes",description:"Without gravity, bones break down and become more brittle, increasing the likelihood of fractures. Research examines how to quantify bone loss and preserve bone strength through diet, exercise, and medication.",reference_url:"https://www.nasa.gov/reference/risk-of-spaceflight-induced-bone-changes/"},{id:"R12",name:"Behavioral Conditions and Psychiatric Disorders",description:"Isolation, radiation, distance from Earth, and other spaceflight stressors may affect crew mental health. Research seeks to better understand and quantify these psychological risks.",reference_url:"https://www.nasa.gov/reference/risk-of-behavioral-conditions-and-psychiatric-disorders/"},{id:"R13",name:"Inadequate Teamwork",description:"Effective crew teamwork is important for mission success and safety. Research examines team function during prolonged isolation, recovery after setbacks, miscommunication, and interpersonal tension.",reference_url:"https://www.nasa.gov/reference/risk-of-inadequate-teamwork/"},{id:"R14",name:"Inadequate Sleep and Irregular Schedules",description:"Crew members may face chronic sleep loss, demanding workloads, and irregularities in their internal biological clocks. Research explores ways to reduce effects on health and safety.",reference_url:"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/"},{id:"R15",name:"Inadequate Systems Operations Support",description:"Deep-space crews may encounter unexpected problems with software, vehicles, or other systems. Research considers when crews need information, what training is needed, and which support options are appropriate.",reference_url:"https://www.nasa.gov/reference/risk-of-inadequate-systems-operations-support/"},{id:"R16",name:"Injury from Dynamic Loads",description:"Crew members risk injury during landing activities. Research examines injury likelihood and ways to prevent these injuries.",reference_url:"https://www.nasa.gov/reference/risk-of-injury-from-dynamic-loads/"},{id:"R17",name:"Radiation-Induced Cancers",description:"Exposure to space radiation may increase cancer risk. Research priorities include identifying mitigation approaches and understanding potential interventions.",reference_url:"https://www.nasa.gov/reference/risk-of-radiation-induced-cancers/"}],research_examples:{artemis_ii_mission:[{name:"ARCHeR",description:"A study described as monitoring astronaut well-being, activity, and sleep patterns to learn more about human health and performance in deep space.",associated_measurements_or_data:["Well-being","Activity","Sleep patterns","Motion","Light exposure"],source_detail:"The page text says selected Artemis II astronauts would wear a wrist actigraphy device measuring motion, sleep patterns, and light exposure."},{name:"Immune Biomarkers",description:"Scientists analyzed blood and saliva samples from Artemis II crew members to investigate how deep space affects the immune system.",associated_measurements_or_data:["Blood samples","Saliva samples","Immune biomarkers"]},{name:"Artemis II Standard Measures",description:"Crews supplied a consistent set of health information to a data bank so that future researchers could study astronaut health.",associated_measurements_or_data:["Standardized health information"]}],low_earth_orbit_investigations:[{name:"B-Complex",description:"Investigates whether a daily B-vitamin supplement can prevent or mitigate brain and eye changes that may affect some humans in space."},{name:"Brain Fluid Pressure",description:"Examines the relationship between fluid pressure inside the skull and changes to astronauts' eyes and brains."},{name:"CIPHER",description:"A suite of studies examining multiple body systems to improve understanding of how the human body changes while orbiting Earth."},{name:"Simulating Manual Piloting for Moon Landings",description:"Assesses how transitions between gravity environments may affect astronauts' piloting capabilities for future Moon landings."},{name:"Spacecraft Occupant Protection",description:"Surveys crew members' potential discomfort during re-entry to Earth and combines the survey information with spacecraft sensor data."},{name:"Spinal Fluid Biomarkers",description:"Seeks to detect substances in astronauts' spinal fluid associated with space-related brain and eye changes."},{name:"Standard Measures",description:"Collects a consistent set of physiological and psychological measurements to better understand how spaceflight affects crew members' bodies and minds."},{name:"Thigh Cuff",description:"Tests whether tight thigh cuffs can keep more bodily fluid in the legs, informing strategies that might avert eye disorders that can develop in space."},{name:"Venous Haemostasis",description:"Examines physical differences among astronauts that may contribute to changes in blood flow and blood coagulation in space."},{name:"Zero T2",description:"Examines how exercising in space without a treadmill affects human health and performance in preparation for deep-space missions."}],past_human_investigations:[{name:"Altered Immunity",description:"Analyzes blood, saliva, and urine samples to investigate how spaceflight alters the immune system.",associated_data:["Blood","Saliva","Urine"]},{name:"Food Acceptability",description:"Assesses how long-term spaceflight affects food appeal to improve current and future space-food systems."},{name:"Food Physiology",description:"Examines whether an enhanced spaceflight diet could help astronauts better adapt to space."},{name:"Omics Archive",description:"Collects blood, urine, saliva, feces, and cells to document how long-duration spaceflight affects health and performance and changes the body at the molecular level.",associated_data:["Blood","Urine","Saliva","Feces","Cells"]},{name:"Space Gardening",description:"Surveys whether growing fresh vegetables in space can ease astronauts' sense of isolation and confinement."},{name:"Spinal Health",description:"Examines scans of astronauts' spines to inform strategies that counter bone and muscle loss."},{name:"Tempus Pro",description:"Tests a commercial telemedicine device that collects and integrates health data, potentially enabling remote, near-real-time diagnoses."},{name:"Veggie Monitoring",description:"Monitors microbial growth on hardware used to store crops in space to support improved plant-production systems and crew safety.",associated_context:"The source includes a caption about the VEG-04 botany study in the Columbus laboratory module's VEGGIE facility. Salad-type plants were harvested after 28 days; some samples were stored for analysis and others were taste-tested by the crew on the ISS. The caption is dated July 7, 2019."}]},external_agency_example:{agency:"Canadian Space Agency (CSA)",article_title:"Monitoring Radiation for Astronaut Health",article_date:"2026-02-26",article_url:"https://www.asc-csa.gc.ca/eng/news/articles/2026/2026-02-26-monitoring-radiation-astronaut-health.asp",summary:"The CSA describes work to improve measurement and understanding of space-radiation exposure during long-duration missions.",technology:{name:"Canadian Active Neutron Spectrometer (CANS)",developer_or_contractor:"Bubble Technology Industries",reported_contract_value:"$5.5 million",purpose:"A compact, autonomous instrument being developed to measure neutron-radiation exposure in space.",capabilities_described:["Continuous operation","Autonomous operation"],source_claim:"The article states that neutron radiation contributes about 30% of total radiation on the ISS and describes it as capable of causing serious biological damage.",predecessor_context:"The article describes bubble detectors as an earlier technology used by CSA astronaut David Saint-Jacques on the ISS.",related_radiation_detection_experiments:[{name:"MOSFET",url:"https://www.asc-csa.gc.ca/eng/astronauts/space-medicine/mosfet.asp"},{name:"EVARM",url:"https://www.asc-csa.gc.ca/eng/iss/evarm.asp"},{name:"Radi-N and Radi-N2",url:"https://www.asc-csa.gc.ca/eng/sciences/radi-n2.asp"}],potential_applications_outside_space:["Cancer therapy","Radiation protection for aircrews","Nuclear threat detection","Public safety"]},related_image_page:"https://www.asc-csa.gc.ca/eng/multimedia/search/image/12705",related_image_url:"https://www.asc-csa.gc.ca/images/actualites/nouvelles/2026-02-26-surveiller-rayonnement-proteger-sante-astronautes-id-12705-ban.jpg"},source_resources:[{organization:"NASA Human Research Program",title:"5 Hazards of Human Spaceflight",url:"https://www.nasa.gov/hrp/hazards/",description:"Overview of the five main hazards and links to detailed NASA material."},{organization:"NASA Human Research Program",title:"Risks of Human Spaceflight",url:"https://www.nasa.gov/hrp/risks/",description:"Overview of human-spaceflight health risks and links to risk-specific material."},{organization:"NASA Human Research Program",title:"Ongoing HRP Research in Space",url:"https://www.nasa.gov/hrp/ongoing-hrp-research/",description:"Articles about ongoing NASA Human Researc
